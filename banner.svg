<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- белая основа -->
  <rect width="1200" height="240" fill="#ffffff"/>

  <!-- угловые скобки, но тёмные: на белом -->
  <path d="M22 22 h44 M22 22 v44" stroke="#111111" stroke-width="4" fill="none"/>
  <path d="M1178 22 h-44 M1178 22 v44" stroke="#111111" stroke-width="4" fill="none"/>
  <path d="M22 218 h44 M22 218 v-44" stroke="#111111" stroke-width="4" fill="none"/>
  <path d="M1178 218 h-44 M1178 218 v-44" stroke="#111111" stroke-width="4" fill="none"/>

  <!-- имя + мигающий курсор -->
  <text x="600" y="150" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="82" font-weight="bold" letter-spacing="6"
        fill="#111111" filter="url(#glow)">drug addict<tspan fill="#00a551">_
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </tspan></text>
</svg>
