<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f0c"/>
      <stop offset="1" stop-color="#101a15"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff9c" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#scan)"/>

  <!-- угловые скобки терминала -->
  <path d="M24 24 h46 M24 24 v46" stroke="#00ff9c" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M1176 24 h-46 M1176 24 v46" stroke="#00ff9c" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M24 256 h46 M24 256 v-46" stroke="#00ff9c" stroke-width="4" fill="none" opacity="0.9"/>
  <path d="M1176 256 h-46 M1176 256 v-46" stroke="#00ff9c" stroke-width="4" fill="none" opacity="0.9"/>

  <!-- строка whoami -->
  <text x="600" y="88" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="26" fill="#3fae78">$ whoami</text>

  <!-- имя + мигающий курсор -->
  <text x="600" y="172" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="76" font-weight="bold" letter-spacing="5"
        fill="#00ff9c" filter="url(#glow)">narkomaniya<tspan fill="#eafff4">_
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </tspan></text>

  <!-- подпись (· = &middot; в XML надо числом) -->
  <text x="600" y="228" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="20" fill="#2f8f63">// guardian of files: Aegis &#183; BitOS &#183; catlet</text>
</svg>
